name: build-desktop

on:
  push:
    branches: [main]
    tags: ['0.1']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build

  package:
    strategy:
      matrix:
        include:
          - os: macos-14
            command: npm run build && npx electron-builder --mac --publish never
            artifact: macos-arm64
          - os: windows-2022
            command: npm run build && npx electron-builder --win --publish never
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-input-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
